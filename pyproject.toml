[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "active-ocr"
version = "0.1.0"
description = "Page-level OCR active-learning research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.4,<13",
  "pydantic>=2.7,<3",
  "rapidfuzz>=3.9,<4",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
modal = ["modal==1.5.5"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
# Optional future LLaMA-Factory work; current page-text runs use Trainer/PEFT directly.
gpu = [
  "accelerate==1.11.0",
  "datasets==4.0.0",
  "llamafactory==0.9.5",
  "peft==0.18.1",
  "pyyaml>=6,<7",
  # Upstream rejects Torch 2.9.x for Qwen3-VL Conv3D (model/loader.py).
  "torch==2.8.0",
  # LLaMA-Factory requires torchaudio but caps nothing; an unpinned resolve picks a build
  # compiled against a newer Torch and fails to load its extension module.
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "transformers==5.6.0",
  "trl==0.24.0",
]

[project.scripts]
active-ocr = "active_ocr.entrypoints.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/active_ocr"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
