[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "active-ocr"
version = "0.1.0"
description = "Page-level OCR active-learning research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.4,<13",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
modal = ["modal==1.5.5"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
gpu = [
  "accelerate==1.14.0",
  "peft==0.20.0",
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.16.1",
]

[project.scripts]
active-ocr = "active_ocr.entrypoints.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/active_ocr"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
