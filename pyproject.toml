[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "active-ocr"
version = "0.1.0"
description = "Human-in-the-loop OCR annotation and active-learning research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "python-dotenv>=1,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]
gpu = [
  "accelerate>=1,<2",
  "fastapi>=0.115,<1",
  "peft>=0.13,<1",
  "torch>=2.4,<3",
  "transformers>=4.57,<6",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
active-ocr = "active_ocr.entrypoints.cli:app"
active-ocr-controller = "active_ocr.entrypoints.controller:main"
active-ocr-gpu = "active_ocr.entrypoints.gpu_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/active_ocr"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
